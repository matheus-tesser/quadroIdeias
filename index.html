<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideias de Site</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <header>
        <h1>Ideias de Site</h1>
    </header>

    <main>
        <form id="form-ideia">
            <label for="titulo">Título</label>
            <input type="text" name="titulo" id="titulo" placeholder="Ex: Criar um banco de dados" maxlength="50" required autofocus autocomplete="on">

            <label for="descricao">Descrição da ideia</label>
            <textarea maxlength="300" placeholder="Ex: Para fazer isso é só..." name="descricao" id="descricao" required></textarea>

            <button id="botaoEnviar" type="submit">Enviar Ideia</button>
        </form>
        
        <p aria-live="polite" id="mensagensUsuarios"></p>

        <section id="ideiasExibidas">
            <h2>Ideias Exibidas</h2>
            <p id="identificadorMensagem">Ainda não há ideias cadastradas.</p>
            <div id="cartoes"></div>
        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
